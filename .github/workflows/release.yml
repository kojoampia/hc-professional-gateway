# Builds this repo's production image and pushes it to GHCR.
#
# This is the `github` deploy channel. `hc-professional-ci/deploy.sh --channel github` deploys
# exactly these images, by hand, with the same compose.yml and the same ./start — so a CI-built
# image and a hand-built one are deployed by the same operation, and only their provenance differs.
#
# --- Tags ----------------------------------------------------------------------------------------
#
# ${{ github.sha }} — the FULL 40-character SHA — plus `latest` as a convenience for humans.
#
# gateway, api and web are three separate repositories with three independent HEADs, so there is no
# shared commit that could name the set. Each repo tags only its own image with its own SHA, and the
# deployment carries three values: GATEWAY_TAG, API_TAG and WEB_TAG.
#
# Do not "simplify" this to one shared tag. That is the bug this project already had and fixed: a
# change confined to one repo republished different content under a tag the other two already used,
# and the image it replaced was the one running in production, leaving no rollback target.
#
# --- The Dockerfile is not in this repo ----------------------------------------------------------
#
# It lives in the deployment repo (docker/gateway.Dockerfile) so these three application repos need no
# deployment files of their own — the same reason build.sh supplies it locally. That is why this
# workflow checks out two repositories.
#
# PREREQUISITE: an `HC_PROFESSIONAL_CI_TOKEN` secret on this repo, holding a token that can read
# kojoampia/hc-professional-ci. A workflow's default GITHUB_TOKEN is scoped to the repo it runs in,
# so it cannot read a private sibling. A fine-grained PAT limited to hc-professional-ci with
# Contents: Read-only is enough. Set `vars.DEPLOY_REPO` if that repo is ever renamed.
#
# --- No quality gate here ------------------------------------------------------------------------
#
# This builds and pushes; it does not run the test suite. The Dockerfile skips tests deliberately: the integration tests need Testcontainers,
# which needs a Docker daemon a build container does not have. So nothing here proves the
# commit is good. Keep any gate in a separate workflow — folding it in would leave the registry with
# no image for a commit that is already on main.
name: Release

on:
  push:
    branches: [main]
  # Re-running a release for an already-merged commit should not require an empty push.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never interrupt a push mid-flight

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: hc-professional-gateway

jobs:
  build-image:
    name: Build and push the gateway image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Into a subdirectory rather than the workspace root, so the deployment checkout below cannot
      # end up inside this repo's build context.
      - name: Check out the gateway
        uses: actions/checkout@v4
        with:
          path: app

      - name: Check out the deployment repo (for docker/gateway.Dockerfile)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.DEPLOY_REPO || format('{0}/hc-professional-ci', github.repository_owner) }}
          # The fallback to github.token is not a working configuration for a private deployment
          # repo. It exists so a missing secret fails HERE, on a checkout that plainly names the repo
          # it could not read, rather than further down on a Dockerfile that mysteriously is absent.
          token: ${{ secrets.HC_PROFESSIONAL_CI_TOKEN || github.token }}
          path: deploycfg

      # GHCR rejects an upper-case path component, and github.repository_owner preserves whatever
      # case the account was registered with — so it is folded rather than assumed.
      - name: Resolve the image path
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_PATH=${REGISTRY}/${owner}/${IMAGE_NAME}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: app
          file: deploycfg/docker/gateway.Dockerfile
          push: true
          # The SHA is what deploy.sh pins; `latest` is a convenience for humans and is never what
          # production resolves to.
          tags: |
            ${{ env.IMAGE_PATH }}:${{ github.sha }}
            ${{ env.IMAGE_PATH }}:latest
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,scope=gateway,mode=max

      - name: Report the deploy command
        run: |
          echo "### Deploy this build" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "GATEWAY_TAG=${{ github.sha }} ./deploy.sh --channel github" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Run from a checkout of hc-professional-ci. Omit the tag to deploy whatever the" >> "$GITHUB_STEP_SUMMARY"
          echo "three sibling checkouts are on." >> "$GITHUB_STEP_SUMMARY"
